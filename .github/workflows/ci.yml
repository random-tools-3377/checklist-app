name: CI

# Runs on every push. Releases come only from pushes to main.
#
# There is deliberately no pull_request or pull_request_target trigger: code from pull requests
# never runs here. The signing secrets are read only by the "sign" job, which runs no build
# code: it signs and checks an APK that the "build" job made without any secrets.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

# A push to a branch cancels that branch's earlier run. Each push to main runs on its own, so a
# release never waits behind an earlier run's slow iPhone job; the release script skips a
# version that is already out, or older than one that is.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The release certificate. Every release must be signed with it, or Android refuses to
  # install the update over the app already on the phone.
  RELEASE_CERT_SHA256: "7C:83:F8:FD:1E:3D:8B:B7:2C:D5:15:AC:24:2E:BE:3B:9A:1B:21:6F:66:7E:72:BC:7A:63:08:7D:3E:15:38:3E"

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check the backup-rules check itself (it has to fail on rules that leave something in)
        run: scripts/check-extraction-rules.sh --self-test

      - name: Unit tests (the shared rules and the shared database code, on the JVM)
        run: ./gradlew --no-daemon :core:jvmTest :shared:jvmTest :app:testDebugUnitTest

      - name: Build the release APKs, unsigned (the checklist app and Checklist AI)
        run: ./gradlew --no-daemon :app:assembleRelease :ai:assembleRelease

      - name: Check the database layout is committed
        run: scripts/check-schema.sh

      - name: Check there is no network permission (before signing)
        run: |
          scripts/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk
          scripts/check-permissions.sh ai/build/outputs/apk/release/ai-release-unsigned.apk

      - name: Put both unsigned APKs together
        run: |
          mkdir -p unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk ai/build/outputs/apk/release/ai-release-unsigned.apk unsigned/
          ls -l unsigned

      - name: Keep the unsigned APKs for the sign job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: unsigned/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: |
            core/build/reports
            shared/build/reports
            app/build/reports
            ai/build/reports
          if-no-files-found: ignore
          retention-days: 7

  emulator:
    name: Emulator test (tick a goal, buy a reward)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its test
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run the test on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Show why the emulator tests failed
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -name 'TEST-*.xml' \
            -exec sed -n '/<failure/,/<\/failure>/p' {} + | head -n 600

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 7

  iphone:
    name: Shared code on iPhone (simulator tests)
    # Keeps the shared code ready for the iPhone app. It doesn't hold back Android releases.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Pick an Xcode the Kotlin compiler supports
        run: |
          ls -d /Applications/Xcode*.app || true
          xcode="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Shared tests on an iPhone simulator (the rules, and the database with SQLite that comes with the app)
        run: ./gradlew --no-daemon :core:iosSimulatorArm64Test :shared:iosSimulatorArm64Test :shared:compileKotlinIosArm64

      - name: Check the iPhone tests really ran
        run: |
          for module in core shared; do
            tests=$(cat $module/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ - | bc)
            echo "$module: ${tests:-0} tests"
            if [ "${tests:-0}" -lt 1 ]; then echo "::error::No iPhone tests ran for $module."; exit 1; fi
          done

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-reports
          path: |
            core/build/reports
            shared/build/reports
          if-no-files-found: ignore
          retention-days: 7

  ipa:
    name: Build the iPhone app (unsigned, for SideStore or AltStore)
    # The iPhone app as an unsigned .ipa: SideStore or AltStore signs it on the phone with the
    # owner's own Apple ID. No secrets are used here, and nothing is signed.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Pick an Xcode the Kotlin compiler supports
        run: |
          xcode="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Check there is no networking code (the iPhone has no permission to take away)
        run: scripts/check-no-network-ios.sh

      - name: Give Gradle more memory (linking the iPhone app needs it)
        run: sed -i '' 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8/' gradle.properties

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build the app, unsigned
        run: |
          set -o pipefail
          version="$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '[:space:]')"
          IFS=. read -r major minor patch <<< "$version"
          build=$((major * 1000000 + minor * 1000 + patch))
          xcodebuild -project iosApp/Checklist.xcodeproj -scheme Checklist -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Check the app links no networking classes
        run: scripts/check-no-network-ios.sh build/ios/Build/Products/Release-iphoneos/Checklist.app/Checklist

      - name: Put the app in an .ipa
        run: |
          mkdir -p ipa/Payload dist
          cp -R build/ios/Build/Products/Release-iphoneos/Checklist.app ipa/Payload/
          (cd ipa && zip -qry ../dist/checklist.ipa Payload)
          ls -l dist

      - name: Keep the .ipa for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-ipa
          path: dist/checklist.ipa
          if-no-files-found: error
          retention-days: 30

  iphone-try:
    name: Open the iPhone app on a simulator
    # Builds the iPhone app for the simulator, opens it, and checks it is still running a while
    # later, with a screenshot in the log. The .ipa only goes in the Release if this passes.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Pick an Xcode the Kotlin compiler supports
        run: |
          xcode="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Give Gradle more memory (linking the iPhone app needs it)
        run: sed -i '' 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8/' gradle.properties

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # GitHub's Macs have Apple chips, and the app is built for arm64 simulators only.
      - name: Build the app for the simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/Checklist.xcodeproj -scheme Checklist -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build | tail -n 100

      - name: Open it and check it keeps running
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, list_ in sorted(devices.items(), reverse=True) if 'iOS' in runtime for d in list_ if d['name'].startswith('iPhone')))
          ")"
          echo "Simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/sim/Build/Products/Debug-iphonesimulator/Checklist.app
          xcrun simctl launch "$udid" io.github.randomtools3377.checklist
          sleep 30
          xcrun simctl io "$udid" screenshot shot.png
          sips -Z 640 shot.png > /dev/null
          echo "----- screenshot (png, base64)"
          base64 -i shot.png
          echo "----- end of screenshot"
          if ! xcrun simctl spawn "$udid" launchctl list | grep -q "io.github.randomtools3377.checklist"; then
            echo "::error::The iPhone app isn't running 30 seconds after opening: it closed or crashed."
            xcrun simctl spawn "$udid" log show --last 2m --predicate 'process == "Checklist"' --style compact | tail -n 80 || true
            exit 1
          fi
          echo "The iPhone app opened and is still running."

  windows:
    name: Build the Windows app
    # The Windows app as an .msi, built and opened on Windows. No secrets are used here, and
    # nothing is signed. Only :core, the jvm part of :shared and :desktop are compiled, so no
    # Android SDK is needed. The .msi only goes in the Release if this passes, and a broken
    # Windows build doesn't hold back Android.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # Windows' git would otherwise check the scripts out with Windows line endings, which bash
      # can't run.
      - name: Keep the files' line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check there is no networking code (a computer has no permission to take away)
        run: scripts/check-no-network-desktop.sh

      - name: Build the .msi, and the app unpacked to try it
        run: ./gradlew --no-daemon :desktop:packageMsi :desktop:createDistributable

      - name: Open the app and check it keeps running
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/build/compose/binaries/main/app -Recurse -Filter Checklist.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::The built Windows app wasn't found."; exit 1 }
          Write-Host "Opening $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Start-Sleep -Seconds 20
          $running = @(Get-Process -Name Checklist -ErrorAction SilentlyContinue)
          if ($running.Count -gt 0) { $running | Stop-Process -Force; Start-Sleep -Seconds 2 }
          Write-Host "----- what the app printed"
          Get-Content app-out.txt, app-err.txt -ErrorAction SilentlyContinue | Select-Object -Last 80
          Write-Host "----- end"
          if ($running.Count -eq 0) {
            Write-Host "::error::The Windows app isn't running 20 seconds after opening: it closed or crashed (exit code $($app.ExitCode))."
            exit 1
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Checklist\checklist.db")) {
            Write-Host "::error::The Windows app kept running but didn't open its database in $env:LOCALAPPDATA\Checklist."
            exit 1
          }
          Write-Host "The Windows app opened, made its database and was still running 20 seconds later."

      - name: Keep the .msi for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign and check the release APKs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Only this repository's scripts are used here; no build code runs in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: dist

      - name: Sign with the release key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Both apps with the same key: Checklist AI only answers apps signed like itself.
        run: |
          scripts/sign-apk.sh dist/app-release-unsigned.apk dist/checklist.apk
          scripts/sign-apk.sh dist/ai-release-unsigned.apk dist/checklist-ai.apk

      - name: Check the signatures are the release certificate
        run: |
          scripts/check-signature.sh dist/checklist.apk "$RELEASE_CERT_SHA256"
          scripts/check-signature.sh dist/checklist-ai.apk "$RELEASE_CERT_SHA256"

      - name: Check there is no network permission
        run: |
          scripts/check-permissions.sh dist/checklist.apk
          scripts/check-permissions.sh dist/checklist-ai.apk

      - name: Check phone backup is off, and the backup rules leave out everything
        run: |
          scripts/check-backup.sh dist/checklist.apk
          scripts/check-backup.sh dist/checklist-ai.apk

      - name: Keep the signed APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: |
            dist/checklist.apk
            dist/checklist-ai.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the Release
    needs: [sign, emulator, ipa, iphone-try, windows]
    # The iPhone and Windows apps are added when they built; a broken iPhone or Windows build
    # doesn't hold back Android.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.sign.result == 'success' && needs.emulator.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.ipa.result == 'success' && needs.iphone-try.result == 'success'
        with:
          name: iphone-ipa
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows.result == 'success'
        with:
          name: windows-msi
          path: dist/windows

      - name: Check once more before publishing
        run: |
          for apk in dist/checklist.apk dist/checklist-ai.apk; do
            scripts/check-signature.sh "$apk" "$RELEASE_CERT_SHA256"
            scripts/check-permissions.sh "$apk"
            scripts/check-backup.sh "$apk"
          done

      - name: Publish both signed APKs, the iPhone app and the Windows app, as one Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi="$(ls dist/windows/*.msi 2>/dev/null | head -n 1 || true)"
          scripts/publish-release.sh dist/checklist.apk dist/checklist-ai.apk dist/checklist.ipa "$msi"
