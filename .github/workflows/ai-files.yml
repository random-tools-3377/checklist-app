name: AI file check
# Downloads the AI file and the speech file from the addresses built into the apps and checks
# their sizes and checksums, so a file Checklist AI would refuse is caught here, not on the
# owner's phone. It runs when the files' details change, or by hand. No secrets are used, and nothing is kept or published.
on:
  push:
    branches: ["**"]
    paths:
      - "core/src/commonMain/kotlin/io/github/randomtools3377/checklist/core/AiFile.kt"
      - ".github/workflows/ai-files.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Download the AI files and check them
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and check each file
        run: |
          set -euo pipefail
          src=core/src/commonMain/kotlin/io/github/randomtools3377/checklist/core/AiFile.kt
          # Each file's address, size and checksum, in the order they are written.
          paste -d' ' \
            <(sed -n 's/^ *const val URL = "\(.*\)"$/\1/p' "$src") \
            <(sed -n 's/^ *const val SIZE = \([0-9_]*\)L$/\1/p' "$src" | tr -d _) \
            <(sed -n 's/^ *const val SHA256 = "\([0-9a-f]*\)"$/\1/p' "$src") > files.txt
          cat files.txt
          count="$(wc -l < files.txt)"
          if [ "$count" -lt 2 ]; then
            echo "::error::Expected the AI file and the speech file in $src, found $count."
            exit 1
          fi
          failed=0
          while read -r url size sha; do
            if [ -z "$url" ] || [ -z "$size" ] || [ ${#sha} != 64 ]; then
              echo "::error::A file in $src is missing its address, size or checksum."
              failed=1
              continue
            fi
            echo "== $url"
            curl -fL --retry 3 --retry-delay 10 -o download "$url"
            got_size="$(stat -c %s download)"
            got_sha="$(sha256sum download | cut -d' ' -f1)"
            echo "Size: $got_size (expected $size)"
            echo "SHA-256: $got_sha (expected $sha)"
            if [ "$got_size" != "$size" ] || [ "$got_sha" != "$sha" ]; then
              echo "::error::$url doesn't match what Checklist AI expects."
              failed=1
            fi
            rm -f download
          done < files.txt
          [ "$failed" = 0 ] && echo "Every file matches what Checklist AI expects."
          exit "$failed"
